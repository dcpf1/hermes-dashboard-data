<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clima·Bot — Public Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #03100a;
    --panel:    #071a0e;
    --border:   #0f2a18;
    --blue:     #4DA8FF;
    --green:    #22d3a4;
    --red:      #f5556d;
    --amber:    #f5a623;
    --text:     #c8f0d8;
    --muted:    #3d6b4d;
    --mono:     'IBM Plex Mono', monospace;
    --sans:     'IBM Plex Sans', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 13px; min-height: 100vh; }

  /* ── TOP BAR ── */
  .topbar {
    display: flex; align-items: center; gap: 20px;
    padding: 10px 24px; border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-icon {
    width: 36px; height: 36px; background: var(--green);
    border-radius: 8px; display: flex; align-items: center;
    justify-content: center; font-size: 18px;
  }
  .brand-name { font-size: 15px; font-weight: 600; letter-spacing: 0.05em; color: var(--text); }
  .brand-sub  { font-size: 10px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
  .status-pill {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 20px;
    border: 1px solid var(--green); color: var(--green);
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
  }
  .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(1.3)} }

  /* ── REFRESH BUTTON ── */
  .refresh-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel);
    color: var(--green); font-size: 11px; font-weight: 600;
    letter-spacing: 0.06em; font-family: var(--mono);
    transition: border-color 0.15s, background 0.15s;
  }
  .refresh-btn:hover { border-color: var(--green); background: rgba(34,211,164,.08); }
  .refresh-btn.spinning svg { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .kpis { display: flex; gap: 28px; margin-left: auto; }
  .kpi { text-align: right; }
  .kpi-label { font-size: 9px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
  .kpi-val   { font-family: var(--mono); font-size: 16px; font-weight: 600; color: var(--text); }
  .kpi-sub   { font-size: 10px; color: var(--muted); }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .amb { color: var(--amber); }
  .grn { color: var(--green); }

  /* ── MAIN GRID ── */
  .grid { display: grid; grid-template-columns: 1fr 340px; gap: 1px; padding: 1px; background: var(--border); }
  .panel { background: var(--bg); padding: 20px 24px; }
  .panel-title { font-size: 10px; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 14px; }

  /* ── BALANCE CHART ── */
  .balance-hero { font-family: var(--mono); font-size: 36px; font-weight: 600; margin-bottom: 4px; color: var(--text); }
  .balance-delta { font-size: 13px; }
  .range-tabs { display: flex; gap: 4px; margin-bottom: 12px; }
  .tab { padding: 3px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; color: var(--muted); border: 1px solid var(--border); }
  .tab.active { background: var(--green); color: #000; border-color: var(--green); }
  #chart-svg { width: 100%; height: 180px; display: block; }

  /* ── BRIER GAUGE ── */
  #gauge-svg { width: 100%; height: 180px; display: block; }
  .brier-val  { font-family: var(--mono); font-size: 30px; font-weight: 600; text-align: center; margin-top: -8px; }
  .brier-lbl  { font-size: 11px; text-align: center; letter-spacing: 0.08em; text-transform: uppercase; }
  .brier-meta { display: flex; justify-content: space-around; margin-top: 12px; }
  .brier-meta .m { text-align: center; }
  .brier-meta .mv { font-family: var(--mono); font-size: 18px; font-weight: 600; color: var(--text); }
  .brier-meta .ml { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }

  /* ── TABLES ── */
  .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .badge { font-size: 10px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { font-size: 9px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; padding: 0 6px 8px; text-align: left; }
  td { padding: 7px 6px; border-top: 1px solid var(--border); font-family: var(--mono); color: var(--text); }
  td.name { font-family: var(--sans); color: var(--text); }
  .side-yes { background: rgba(77,168,255,.12); color: var(--blue); padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; }
  .side-no  { background: rgba(245,85,109,.12); color: var(--red);  padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; }
  .ev-bar-wrap { display: flex; align-items: center; gap: 6px; }
  .ev-bar { height: 4px; border-radius: 2px; min-width: 2px; }
  .urgent { color: var(--red) !important; }
  .warn   { color: var(--amber) !important; }
  .closed-lbl {
    font-size: 9px; padding: 2px 6px; border-radius: 3px;
    font-family: var(--mono); font-weight: 600; letter-spacing: 0.05em;
  }
  .lbl-tp       { background: rgba(34,211,164,.12); color: var(--green); }
  .lbl-resolved { background: rgba(93,117,138,.12); color: var(--muted); color: #7aabcc; }
  .lbl-invalid  { background: rgba(245,166,35,.12);  color: var(--amber); }

  /* ── RESOLVED STRIP ── */
  .strip { display: flex; gap: 3px; margin-bottom: 14px; }
  .strip-dot { width: 18px; height: 6px; border-radius: 3px; }
  .correct-dot  { background: var(--green); }
  .incorrect-dot{ background: var(--red); }
  .outcome-ok   { color: var(--green); }
  .outcome-bad  { color: var(--red); }

  /* ── CITY LEADERBOARD ── */
  .city-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 8px; }
  .city-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; padding: 10px 12px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .city-card-name { font-size: 12px; font-weight: 500; color: var(--text); }
  .city-card-meta { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .city-card-pnl  { font-family: var(--mono); font-size: 14px; font-weight: 600; }

  /* ── LOADING / ERROR ── */
  .loading { text-align: center; padding: 60px; color: var(--muted); font-size: 14px; }
  .error-msg { color: var(--red); text-align: center; padding: 20px; }

  /* ── OPPS BUTTON ── */
  .opps-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--amber); background: rgba(245,166,35,.08);
    color: var(--amber); font-size: 11px; font-weight: 600;
    letter-spacing: 0.06em; font-family: var(--mono);
    transition: border-color 0.15s, background 0.15s;
  }
  .opps-btn:hover { background: rgba(245,166,35,.15); }
  .opps-btn.active { background: rgba(245,166,35,.2); box-shadow: 0 0 12px rgba(245,166,35,.3); }

  /* ── OPPS MODAL ── */
  .opps-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.8); z-index: 1000;
    align-items: flex-start; justify-content: center;
    padding-top: 80px;
  }
  .opps-overlay.open { display: flex; }
  .opps-modal {
    background: var(--panel); border: 1px solid var(--amber);
    border-radius: 10px; padding: 24px; width: 520px; max-width: 95vw;
    box-shadow: 0 0 40px rgba(245,166,35,.2);
  }
  .opps-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
  }
  .opps-title { font-size: 11px; color: var(--amber); letter-spacing: 0.12em; text-transform: uppercase; font-family: var(--mono); }
  .opps-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; padding: 0 4px; }
  .opps-close:hover { color: var(--text); }
  .opps-updated { font-size: 10px; color: var(--muted); font-family: var(--mono); }
  .opp-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  .opp-row:last-child { border-bottom: none; }
  .opp-score {
    font-family: var(--mono); font-size: 15px; font-weight: 600;
    width: 32px; flex-shrink: 0; text-align: center;
  }
  .opp-info { flex: 1; }
  .opp-name { font-size: 13px; color: var(--text); margin-bottom: 2px; }
  .opp-tags { display: flex; gap: 6px; }
  .opp-tag {
    font-size: 9px; padding: 2px 7px; border-radius: 4px;
    font-family: var(--mono); letter-spacing: 0.05em;
    border: 1px solid var(--border); color: var(--muted);
  }
  .opp-tag.ttfd { border-color: rgba(34,211,164,.3); color: var(--green); background: rgba(34,211,164,.06); }
  .opp-tag.capital { border-color: var(--border); }
  .opp-empty { color: var(--muted); text-align: center; padding: 20px; font-size: 12px; }

  /* ── BOTTOM STRIP ── */
  .footer { padding: 8px 24px; font-size: 10px; color: var(--muted); border-top: 1px solid var(--border); display: flex; justify-content: space-between; }
</style>
</head>
<body>

<div class="opps-overlay" id="opps-overlay" onclick="handleOverlayClick(event)">
  <div class="opps-modal" id="opps-modal">
    <div class="opps-header">
      <span class="opps-title">&#9733; Top Opportunities</span>
      <div style="display:flex;align-items:center;gap:12px">
        <span class="opps-updated" id="opps-updated"></span>
        <button class="opps-close" onclick="closeOpps()">&#x2715;</button>
      </div>
    </div>
    <div id="opps-content"><div class="opp-empty">Loading...</div></div>
  </div>
</div>

<div id="app"><div class="loading">Loading live data...</div></div>

<script>
const DATA_URL    = 'https://raw.githubusercontent.com/dcpf1/hermes-dashboard-data/main/dashboard_data.json';
const HIST_URL    = 'https://raw.githubusercontent.com/dcpf1/hermes-dashboard-data/main/balance_history.json';
const REFRESH_MS  = 60000;
const REM_URL     = 'https://raw.githubusercontent.com/dcpf1/hermes-dashboard-data/main/reminders.json';
let   activeRange   = '7D';
let   activeView    = 'dashboard';
let   lastData      = null;
let   lastHist      = null;
let   lastReminders = null;

// ── REMINDERS HELPERS ─────────────────────────────────────────────────────
const DISMISSED_KEY = 'dismissed_reminders_v1';
function getDismissed() {
  try { return JSON.parse(localStorage.getItem(DISMISSED_KEY) || '[]'); }
  catch(e) { return []; }
}
function saveDismissed(ids) { localStorage.setItem(DISMISSED_KEY, JSON.stringify(ids)); }
function dismissItem(id) {
  const ids = getDismissed();
  if (!ids.includes(id)) { ids.push(id); saveDismissed(ids); }
  const el = document.getElementById('r-' + id);
  if (el) {
    el.style.transition = 'opacity 0.25s, transform 0.25s, max-height 0.3s, margin 0.3s, padding 0.3s';
    el.style.opacity = '0'; el.style.transform = 'translateX(24px)';
    el.style.maxHeight = '0'; el.style.overflow = 'hidden';
    el.style.margin = '0'; el.style.padding = '0';
    setTimeout(() => { el.remove(); updateBadgeCount(); }, 320);
  }
}
function updateBadgeCount() {
  if (!lastReminders) return;
  const d2 = getDismissed();
  const n = (lastReminders.manual||[]).filter(r=>!r.done&&!d2.includes(r.id)).length
          + (lastReminders.auto||[]).filter(r=>!r.met&&!d2.includes(r.id)).length;
  const b = document.getElementById('rem-badge');
  if (!b) return;
  b.textContent = n;
  b.style.display = n > 0 ? 'inline-flex' : 'none';
}
function showView(name) {
  activeView = name;
  const dash=document.getElementById('view-dashboard'), rem=document.getElementById('view-reminders');
  const btnD=document.getElementById('nav-dashboard'),  btnR=document.getElementById('nav-reminders');
  if (!dash||!rem) return;
  if (name==='dashboard') {
    dash.style.display=''; rem.style.display='none';
    if (btnD){btnD.style.borderColor='var(--green)';btnD.style.color='var(--green)';}
    if (btnR){btnR.style.borderColor='var(--border)';btnR.style.color='var(--muted)';}
  } else {
    dash.style.display='none'; rem.style.display='';
    if (btnR){btnR.style.borderColor='var(--green)';btnR.style.color='var(--green)';}
    if (btnD){btnD.style.borderColor='var(--border)';btnD.style.color='var(--muted)';}
    if (lastReminders) renderRemindersInto(lastReminders);
  }
}

// ── REMINDERS RENDER ──────────────────────────────────────────────────────
function renderRemindersInto(rem) {
  const container = document.getElementById('view-reminders');
  if (!container) return;
  const d2 = getDismissed();
  const PB={high:'var(--red)',warn:'var(--amber)',info:'var(--blue)',neutral:'var(--border)'};
  const PT={high:'background:rgba(245,85,109,.15);color:var(--red)',warn:'background:rgba(245,166,35,.15);color:var(--amber)',info:'background:rgba(77,168,255,.15);color:var(--blue)',neutral:'background:rgba(48,54,61,.4);color:var(--muted)'};
  const PL={high:'HIGH',warn:'DEADLINE',info:'IN PROGRESS',neutral:'PARKED'};

  function card(item, showDismiss) {
    if (d2.includes(item.id)) return '';
    // same null trap as closedByLabel(): a hand-written manual reminder with no
    // priority would otherwise throw here and blank the entire dashboard.
    const prio=item.priority||'neutral';
    const bdr=PB[prio]||PB.neutral, ts=PT[prio]||PT.neutral, tl=PL[prio]||String(prio).toUpperCase();
    let pg='';
    if (item.type==='threshold'&&item.target&&item.current!=null) {
      const pct=Math.min(100,Math.round(item.current/item.target*100)), fc=item.met?'var(--green)':(item.priority==='warn'?'var(--amber)':'var(--blue)');
      pg=`<div style="margin-top:8px"><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:4px"><span>${item.current.toLocaleString()} / ${item.target.toLocaleString()} ${item.unit}</span><span style="color:${fc}">${item.met?'met ✓':pct+'%'}</span></div><div style="height:4px;background:var(--border);border-radius:2px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${fc};border-radius:2px"></div></div></div>`;
    }
    if (item.type==='countdown') {
      const el=Math.max(0,Math.min(100,Math.round((1-item.current/42)*100)));
      pg=`<div style="margin-top:8px"><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:4px"><span>${item.current} days remaining</span><span style="color:var(--red)">${el}% elapsed</span></div><div style="height:4px;background:var(--border);border-radius:2px;overflow:hidden"><div style="height:100%;width:${el}%;background:var(--red);border-radius:2px"></div></div></div>`;
    }
    const tags=(item.tags||[]).map(t=>`<span style="font-size:10px;background:rgba(48,54,61,.4);color:var(--muted);padding:2px 7px;border-radius:10px;font-weight:600">${t}</span>`).join('');
    const db=showDismiss?`<button onclick="dismissItem('${item.id}')" style="font-size:10px;background:transparent;border:1px solid var(--border);color:var(--muted);padding:3px 8px;border-radius:3px;cursor:pointer;white-space:nowrap;font-family:var(--mono)" onmouseover="this.style.borderColor='var(--green)';this.style.color='var(--green)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--muted)'">✓ done</button>`:'';
    return `<div id="r-${item.id}" style="display:flex;gap:14px;padding:12px 16px;border-radius:6px;border:1px solid var(--border);border-left:3px solid ${bdr};background:var(--panel);margin-bottom:8px"><div style="flex:1"><div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px">${item.title}</div><div style="font-size:12px;color:var(--muted);line-height:1.5">${item.description}</div>${pg}<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center"><span style="${ts};font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px">${tl}</span><span style="font-size:10px;background:rgba(48,54,61,.4);color:var(--muted);padding:2px 7px;border-radius:10px;font-weight:600">${item.project}</span>${tags}${item.added?`<span style="font-size:10px;color:var(--muted)">added ${item.added}</span>`:''}</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:80px">${db}</div></div>`;
  }

  function sh(color,lbl){return `<div style="display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:12px"><div style="width:8px;height:8px;border-radius:50%;background:${color}"></div>${lbl}</div>`;}

  const aItems=(rem.manual||[]).filter(r=>!r.done&&!d2.includes(r.id));
  const aHtml=aItems.map(r=>card(r,true)).join('')||'<div style="color:var(--muted);font-size:12px;padding:8px 0">No pending action items.</div>';
  const addForm=`<div style="border:1px dashed var(--border);border-radius:6px;padding:14px 16px;margin-top:4px;background:var(--bg)"><div style="font-size:10px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:10px">+ Add reminder</div><div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap"><input id="rem-new-title" type="text" placeholder="What to remember…" style="flex:1;min-width:200px;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:7px 10px;font-size:12px;outline:none;font-family:var(--sans)" onkeydown="if(event.key==='Enter')addReminderLocal()" onfocus="this.style.borderColor='var(--green)'" onblur="this.style.borderColor='var(--border)'"/><select id="rem-new-priority" style="background:var(--panel);border:1px solid var(--border);color:var(--muted);border-radius:4px;padding:7px 10px;font-size:12px"><option value="high">High</option><option value="warn">Medium</option><option value="neutral" selected>Low</option></select><select id="rem-new-project" style="background:var(--panel);border:1px solid var(--border);color:var(--muted);border-radius:4px;padding:7px 10px;font-size:12px"><option>Weatherbot</option><option>BTC Bot</option><option>General</option></select><button onclick="addReminderLocal()" style="padding:7px 16px;background:var(--green);border:none;border-radius:4px;color:#000;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--mono)">Add</button></div><div style="font-size:10px;color:var(--muted)">Items added here are local (this browser). Say <strong style="color:var(--text)">"remind me to X"</strong> in a Claude session to save permanently.</div></div>`;
  const thItems=(rem.auto||[]).filter(r=>!d2.includes(r.id));
  const thHtml=thItems.map(r=>card(r,false)).join('')||'<div style="color:var(--muted);font-size:12px;padding:8px 0">No threshold reminders.</div>';
  const upd=rem.updated_at?new Date(rem.updated_at).toUTCString().slice(0,25):'';
  container.innerHTML=`<div style="max-width:860px;margin:0 auto;padding:24px 20px"><div style="font-size:13px;font-weight:700;letter-spacing:2px;color:var(--muted);margin-bottom:20px;text-transform:uppercase">Reminders &amp; Action Items</div><div style="margin-bottom:28px">${sh('var(--red)','Action Items &middot; '+aItems.length+' pending')}${aHtml}${addForm}</div><div style="margin-bottom:28px">${sh('var(--blue)','Threshold Reminders &middot; auto-updated by bot every scan')}${thHtml}</div><div style="font-size:10px;color:var(--muted);text-align:center;margin-top:32px;padding-bottom:24px"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:4px;vertical-align:middle"></span>Threshold data auto-updated by bot &middot; Manual items via Claude sessions &middot; Last sync ${upd}</div></div>`;
}

function addReminderLocal() {
  const t=document.getElementById('rem-new-title'), p=document.getElementById('rem-new-priority'), j=document.getElementById('rem-new-project');
  const title=(t&&t.value.trim())||''; if (!title) return;
  if (!lastReminders) return;
  lastReminders.manual.push({id:'local-'+Date.now(),title,description:'(added via browser — say "remind me to X" in Claude to save permanently)',priority:(p&&p.value)||'neutral',project:(j&&j.value)||'General',tags:[],added:new Date().toISOString().slice(0,10),done:false});
  renderRemindersInto(lastReminders); updateBadgeCount();
}


// ── FETCH ─────────────────────────────────────────────────────────────────
async function fetchAll() {
  const [d, h, rem] = await Promise.all([
    fetch(DATA_URL  + '?t=' + Date.now()).then(r => r.json()),
    fetch(HIST_URL  + '?t=' + Date.now()).then(r => r.json()),
    fetch(REM_URL   + '?t=' + Date.now()).then(r => r.json()).catch(() => ({ manual: [], auto: [] })),
  ]);
  lastData = d; lastHist = h; lastReminders = rem;
  render(d, h);
  updateBadgeCount();
  if (activeView === 'reminders') renderRemindersInto(rem);
}

// ── RENDER ────────────────────────────────────────────────────────────────

// ── BALANCE CHART ─────────────────────────────────────────────────────────
function filterHistory(hist) {
  if (!hist || !hist.length) return [];
  const now   = Date.now();
  const cutoff= activeRange === '7D'  ? 7*864e5 :
                activeRange === '30D' ? 30*864e5 : Infinity;
  return hist.filter(h => now - new Date(h.ts).getTime() <= cutoff);
}

function renderChart(hist) {
  const pts = filterHistory(hist);
  if (!pts.length) return '<div style="height:180px;display:flex;align-items:center;justify-content:center;color:var(--muted)">No history yet</div>';

  const vals   = pts.map(p => p.balance);
  const times  = pts.map(p => new Date(p.ts).getTime());
  const minV   = Math.min(...vals, lastData.balance.starting) * 0.98;
  const maxV   = Math.max(...vals) * 1.02;
  const W=680, H=160, PAD=10;

  const cx = i => PAD + (times[i]-times[0])/(times[times.length-1]-times[0]||1)*(W-2*PAD);
  const cy = v => H - PAD - (v-minV)/(maxV-minV||1)*(H-2*PAD);

  const line   = pts.map((p,i) => (i?'L':'M')+cx(i).toFixed(1)+' '+cy(p.balance).toFixed(1)).join(' ');
  const area   = line + ` L${cx(pts.length-1).toFixed(1)} ${H} L${PAD} ${H} Z`;
  const startY = cy(lastData.balance.starting).toFixed(1);

  return `<svg id="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs>
      <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#22d3a4" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="#22d3a4" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="${area}" fill="url(#grad)"/>
    <path d="${line}" fill="none" stroke="#22d3a4" stroke-width="2"/>
    <line x1="${PAD}" y1="${startY}" x2="${W-PAD}" y2="${startY}" stroke="#3d6b4d" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="${PAD+4}" y="${parseFloat(startY)-4}" fill="#3d6b4d" font-size="9" font-family="IBM Plex Mono">$${lastData.balance.starting} START</text>
  </svg>`;
}

// ── BRIER GAUGE ───────────────────────────────────────────────────────────
function renderGauge(score, color) {
  const s = score != null ? Math.min(Math.max(score, 0), 1) : 0.5;
  const angle = -140 + s * 280;
  const rad   = angle * Math.PI / 180;
  const R=90, cx=140, cy=120;
  const nx = cx + R * Math.cos(rad);
  const ny = cy + R * Math.sin(rad);

  function arc(r, a1, a2, col) {
    const r1 = a1*Math.PI/180, r2 = a2*Math.PI/180;
    return `<path d="M${(cx+r*Math.cos(r1)).toFixed(1)} ${(cy+r*Math.sin(r1)).toFixed(1)}
      A${r} ${r} 0 ${a2-a1>180?1:0} 1 ${(cx+r*Math.cos(r2)).toFixed(1)} ${(cy+r*Math.sin(r2)).toFixed(1)}"
      fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round"/>`;
  }

  return `<svg viewBox="0 0 280 150" style="width:100%;height:150px">
    ${arc(R,-140,-20,'#22d3a4')}
    ${arc(R,-20, 20,'#f5a623')}
    ${arc(R, 20,140,'#f5556d')}
    <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}"
      stroke="${color}" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="5" fill="${color}"/>
    <text x="42" y="145" fill="#22d3a4" font-size="9" font-family="IBM Plex Mono">0.00</text>
    <text x="110" y="145" fill="#f5a623" font-size="9" font-family="IBM Plex Mono">0.18</text>
    <text x="168" y="145" fill="#f5556d" font-size="9" font-family="IBM Plex Mono">0.25+</text>
  </svg>`;
}

// ── OPEN POSITIONS ────────────────────────────────────────────────────────
function renderPositions(positions) {
  if (!positions.length) return '<div style="padding:20px;color:var(--muted);text-align:center">No open positions</div>';
  const rows = positions.map(p => {
    const sideClass = p.side === 'YES' ? 'side-yes' : 'side-no';
    const bucket = p.bucket_low === p.bucket_high
      ? `${p.bucket_low}°${p.unit}`
      : `${p.bucket_low}–${p.bucket_high}°${p.unit}`;
    const evColor = p.ev_pct >= 15 ? 'var(--green)' : p.ev_pct >= 0 ? 'var(--blue)' : 'var(--red)';
    const evSign  = p.ev_pct >= 0 ? '+' : '';
    const hlClass = (p.hours_left != null && p.hours_left < 2) ? 'urgent' : (p.hours_left != null && p.hours_left < 6) ? 'warn' : '';
    const hLeft   = p.hours_left != null ? p.hours_left.toFixed(1)+'h' : '—';
    const pnl     = p.unrealized_pnl != null ? p.unrealized_pnl : (p.pnl || 0);
    const pnlSign = pnl >= 0 ? '+' : '';
    const pnlColor= pnl > 0 ? 'var(--green)' : pnl < 0 ? 'var(--red)' : 'var(--muted)';
    return `<tr>
      <td class="name">${p.city}<br><span style="color:var(--muted);font-size:10px">${bucket}</span></td>
      <td><span class="${sideClass}">${p.side}</span></td>
      <td>$${p.entry_price != null ? p.entry_price.toFixed(2) : '—'}</td>
      <td>$${(p.current_p).toFixed(2)}</td>
      <td>$${p.cost.toFixed(2)}</td>
      <td>
        <div class="ev-bar-wrap">
          <div class="ev-bar" style="width:${Math.min(Math.abs(p.ev_pct)*2,60)}px;background:${evColor}"></div>
          <span style="color:${evColor}">${evSign}${p.ev_pct.toFixed(1)}%</span>
        </div>
      </td>
      <td style="color:${pnlColor}">${pnlSign}$${Math.abs(pnl).toFixed(2)}</td>
      <td class="${hlClass}">${hLeft}</td>
    </tr>`;
  }).join('');
  return `<table>
    <thead><tr>
      <th>Market</th><th>Side</th><th>Entry</th><th>Current P</th><th>Size</th><th>EV</th><th>Unreal. P&amp;L</th><th>Resolves</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

// ── RESOLVED STRIP + TABLE ────────────────────────────────────────────────
function renderStrip(resolved) {
  const dots = resolved.map(r =>
    `<div class="strip-dot ${r.correct ? 'correct-dot' : 'incorrect-dot'}" title="${r.city} ${r.correct?'WIN':'LOSS'} ${r.pnl>=0?'+':''}$${r.pnl.toFixed(2)}"></div>`
  ).join('');
  return `<div class="strip">${dots}</div>`;
}

function closedByLabel(raw) {
  const map = {
    'take_profit':        ['TP', 'lbl-tp'],
    'resolved':           ['SETTLED', 'lbl-resolved'],
    'model_invalidation': ['INVALID', 'lbl-invalid'],
    'forecast_changed':   ['DRIFT', 'lbl-invalid'],
    'metar_override':     ['METAR', 'lbl-tp'],
  };
  // closed_by is null for positions graded at expiry without an exit (VC-provisional
  // rows: bot_v2.py loop-2 logs pos["close_reason"] which was never set). Guard it --
  // an unguarded .toUpperCase() here took the whole dashboard down on 2026-07-25.
  if (!raw) return `<span class="closed-lbl lbl-resolved">&mdash;</span>`;
  const [txt, cls] = map[raw] || [String(raw).toUpperCase(), 'lbl-resolved'];
  return `<span class="closed-lbl ${cls}">${txt}</span>`;
}

function renderResolved(resolved) {
  if (!resolved.length) return '<div style="padding:20px;color:var(--muted);text-align:center">No resolved trades yet</div>';
  const rows = resolved.map(r => {
    const sideClass = r.side === 'YES' ? 'side-yes' : 'side-no';
    const oc = r.correct ? 'outcome-ok' : 'outcome-bad';
    const ol = r.correct ? '✓ Correct' : '✗ Wrong';
    const pnlSign  = r.pnl >= 0 ? '+' : '';
    const pnlColor = r.pnl > 0 ? 'var(--green)' : r.pnl < 0 ? 'var(--red)' : 'var(--muted)';
    const ago = timeAgo(r.ts);
    return `<tr>
      <td class="name">${r.city}<br><span style="color:var(--muted);font-size:10px">${r.bucket}</span></td>
      <td><span class="${sideClass}">${r.side}</span></td>
      <td class="${oc}">${ol}</td>
      <td style="color:${pnlColor}">${pnlSign}$${Math.abs(r.pnl).toFixed(2)}</td>
      <td>${closedByLabel(r.closed_by)}</td>
      <td style="color:var(--muted)">${ago}</td>
    </tr>`;
  }).join('');
  return `<table>
    <thead><tr>
      <th>Market</th><th>Side</th><th>Outcome</th><th>P&amp;L</th><th>Exit</th><th>Settled</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

// ── CITY LEADERBOARD ──────────────────────────────────────────────────────
function renderCityLeaderboard(stats) {
  if (!stats || !Object.keys(stats).length) return '<div style="color:var(--muted);text-align:center;padding:16px">No city data yet</div>';
  const entries = Object.entries(stats).sort((a,b) => b[1].total_pnl - a[1].total_pnl);
  const cards = entries.map(([city, s]) => {
    const pnl      = s.total_pnl;
    const pnlSign  = pnl >= 0 ? '+' : '';
    const pnlColor = pnl > 0 ? 'var(--green)' : pnl < 0 ? 'var(--red)' : 'var(--muted)';
    const wr       = (s.win_rate * 100).toFixed(0);
    const name     = city.replace(/-/g,' ').replace(/\b\w/g, c => c.toUpperCase());
    return `<div class="city-card">
      <div>
        <div class="city-card-name">${name}</div>
        <div class="city-card-meta">${s.n} trades · ${wr}% win</div>
      </div>
      <div class="city-card-pnl" style="color:${pnlColor}">${pnlSign}$${Math.abs(pnl).toFixed(2)}</div>
    </div>`;
  }).join('');
  return `<div class="city-grid">${cards}</div>`;
}

// ── HELPERS ───────────────────────────────────────────────────────────────
function timeAgo(iso) {
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 3600)  return Math.round(diff/60)+'m ago';
  if (diff < 86400) return Math.round(diff/3600)+'h ago';
  return Math.round(diff/86400)+'d ago';
}

function setRange(r) {
  activeRange = r;
  if (lastData && lastHist) { render(lastData, lastHist); updateBadgeCount(); }
}

// ── MANUAL REFRESH ────────────────────────────────────────────────────────
function manualRefresh() {
  const btn = document.getElementById('refresh-btn');
  if (btn) btn.classList.add('spinning');
  fetchAll()
    .catch(e => console.error('Refresh failed:', e))
    .finally(() => { if (btn) btn.classList.remove('spinning'); });
}

// ── OPPS MODAL ────────────────────────────────────────────────────────────
function toggleOpps() {
  const overlay = document.getElementById('opps-overlay');
  const isOpen = overlay.classList.contains('open');
  if (isOpen) { closeOpps(); } else { openOpps(); }
}

function openOpps() {
  const overlay = document.getElementById('opps-overlay');
  const btn = document.getElementById('opps-btn');
  overlay.classList.add('open');
  if (btn) btn.classList.add('active');
  renderOpps(lastData);
  document.addEventListener('keydown', handleEsc);
}

function closeOpps() {
  const overlay = document.getElementById('opps-overlay');
  const btn = document.getElementById('opps-btn');
  overlay.classList.remove('open');
  if (btn) btn.classList.remove('active');
  document.removeEventListener('keydown', handleEsc);
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('opps-overlay')) closeOpps();
}

function handleEsc(e) { if (e.key === 'Escape') closeOpps(); }

function renderOpps(data) {
  const el = document.getElementById('opps-content');
  const upEl = document.getElementById('opps-updated');
  if (!el) return;
  const opps = data && data.opps;
  if (!opps || !opps.opportunities || !opps.opportunities.length) {
    el.innerHTML = '<div class="opp-empty">No opportunities data.<br>Run /scan-opportunities to populate.</div>';
    return;
  }
  if (upEl && opps.updated) upEl.textContent = 'Updated ' + opps.updated;
  el.innerHTML = opps.opportunities.map(o => {
    const scoreColor = o.score >= 80 ? '#22d3a4' : o.score >= 70 ? 'var(--green)' : 'var(--amber)';
    return `<div class="opp-row">
      <div class="opp-score" style="color:${scoreColor}">${o.score}</div>
      <div class="opp-info">
        <div class="opp-name">${o.title}</div>
        <div class="opp-tags">
          <span class="opp-tag ttfd">${o.ttfd}</span>
          <span class="opp-tag capital">${o.capital}</span>
          ${o.status === 'new' ? '<span class="opp-tag" style="border-color:rgba(77,168,255,.3);color:var(--blue);background:rgba(77,168,255,.06)">NEW</span>' : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── NEXT SCAN COUNTDOWN ───────────────────────────────────────────────────
function startScanCountdown() {
  updateScanCountdown();
  setInterval(updateScanCountdown, 1000);
}

function updateScanCountdown() {
  const el = document.getElementById('scan-countdown');
  const modeEl = document.getElementById('scan-mode');
  if (!el) return;

  const now = new Date();
  const utcH = now.getUTCHours();
  const utcM = now.getUTCMinutes();
  const utcS = now.getUTCSeconds();
  const totalSec = utcH * 3600 + utcM * 60 + utcS;

  // Check fast-scan mode: any position with hours_left < 6
  const fastMode = lastData && lastData.open_positions &&
    lastData.open_positions.some(p => p.hours_left != null && p.hours_left < 6);
  const intervalSec = fastMode ? 20 * 60 : 3600;

  // Candidate scan times in seconds from midnight UTC
  const scanTimes = [];
  for (let h = 0; h < 24; h++) {
    scanTimes.push(h * 3600 + 55 * 60); // :55 each hour
  }
  scanTimes.push(6 * 3600 + 50 * 60);   // 06:50 UTC
  scanTimes.push(18 * 3600 + 50 * 60);  // 18:50 UTC

  // Find next scan time
  let nextSec = null;
  for (const t of scanTimes) {
    const diff = t - totalSec;
    if (diff > 0 && (nextSec === null || diff < nextSec)) nextSec = diff;
  }
  // If no time left today, use first tomorrow
  if (nextSec === null) nextSec = 24 * 3600 - totalSec + 55 * 60;

  // For fast mode, also consider 20-min intervals from now
  if (fastMode) {
    const modSec = totalSec % intervalSec;
    const toNext = intervalSec - modSec;
    if (toNext < nextSec) nextSec = toNext;
  }

  const mm = String(Math.floor(nextSec / 60)).padStart(2, '0');
  const ss = String(nextSec % 60).padStart(2, '0');
  el.textContent = mm + ':' + ss;
  el.style.color = nextSec < 300 ? 'var(--amber)' : 'var(--text)';
  if (modeEl) {
    modeEl.textContent = fastMode ? 'FAST MODE' : 'normal';
    modeEl.style.color = fastMode ? 'var(--amber)' : '';
  }
}

// ── LEAD-TIME BRIER ───────────────────────────────────────────────────────
function renderLeadBrier(lb) {
  if (!lb || !Object.keys(lb).length) {
    return '<div style="color:var(--muted);padding:12px 0;font-size:12px">Awaiting resolved trades...</div>';
  }
  const bands = [
    { key: 'lt6',    label: '< 6h',   },
    { key: '6to24',  label: '6–24h',  },
    { key: '24to48', label: '24–48h', },
    { key: 'gt48',   label: '48h+',   },
  ];
  const rows = bands.map(b => {
    const d = lb[b.key];
    if (!d || d.n === 0) return `
      <div style="display:flex;align-items:center;gap:16px;padding:8px 0;border-bottom:1px solid var(--border)">
        <div style="width:60px;font-family:var(--mono);font-size:11px;color:var(--muted)">${b.label}</div>
        <div style="color:var(--muted);font-size:11px;flex:1">no data</div>
      </div>`;
    const score = d.brier;
    const color = score < 0.20 ? 'var(--green)' : score < 0.25 ? 'var(--amber)' : 'var(--red)';
    const barW  = Math.min(score * 400, 200);
    return `
      <div style="display:flex;align-items:center;gap:16px;padding:8px 0;border-bottom:1px solid var(--border)">
        <div style="width:60px;font-family:var(--mono);font-size:11px;color:var(--muted)">${b.label}</div>
        <div style="font-family:var(--mono);font-size:14px;font-weight:600;color:${color};width:48px">${score.toFixed(3)}</div>
        <div style="flex:1;height:4px;background:var(--border);border-radius:2px;max-width:200px">
          <div style="height:100%;width:${barW}px;background:${color};border-radius:2px;transition:width .5s"></div>
        </div>
        <div style="font-size:10px;color:var(--muted);font-family:var(--mono);width:40px">n=${d.n}</div>
      </div>`;
  }).join('');
  return `<div style="max-width:500px">${rows}</div>`;
}

// ── INIT ──────────────────────────────────────────────────────────────────
fetchAll().catch(e => {
  document.getElementById('app').innerHTML = `<div class="error-msg">Failed to load data: ${e.message}<br><small>Check console. GitHub raw URL may have CORS delay on first push.</small></div>`;
});
setInterval(fetchAll, REFRESH_MS);
startScanCountdown();
</script>
